name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Checkout libsandy
        uses: actions/checkout@v4
        with:
          repository: opa334/libSandu
          path: libsandy

      - name: Install libsandy to theos
        run: |
          cd libSandy
          ./install_to_theos.sh

      - name: Build Package
        run: |
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContraStore
          path: packages/*.deb
