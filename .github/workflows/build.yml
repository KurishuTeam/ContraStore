name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        brew install ldid-procursus make
        echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
        
    - name: Checkout Theos
      uses: actions/checkout@v4
      with:
        repository: theos/theos
        path: theos
        submodules: recursive

    - name: Setup environment
      run: |
        echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV
        
    - name: Install iOS SDKs
      run: |
        cd theos
        ./bin/install-sdk iPhoneOS16.5
        ./bin/install-sdk iPhoneOS14.5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'

    - name: Copy XPC Headers
      run: |
        cp -r $(xcrun --sdk macosx --show-sdk-path)/usr/include/xpc $THEOS/include/

    - name: Checkout libSandy
      uses: actions/checkout@v4
      with:
        repository: opa334/libSandy
        path: libSandy

    - name: Install libSandy to theos
      run: |
        cd libSandy
        THEOS_PACKAGE_SCHEME=rootless ARCHS="arm64 arm64e" ./install_to_theos.sh
        
    - name: Build Package
      run: | 
        make package FINALPACKAGE=1
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ContraStore
        path: packages/*.deb
        if-no-files-found: error
