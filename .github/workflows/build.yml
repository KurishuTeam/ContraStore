name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GNU Make
        run: |
          brew install make
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Checkout libSandy
        uses: actions/checkout@v4
        with:
          repository: opa334/libSandy
          path: libSandy

      - name: Install libSandy to theos
        run: |
          cd libSandy
          THEOS_PACKAGE_FORMAT="rootless" ARCHS="arm64 arm64e" ./install_to_theos.sh

      - name: Build Package
        run: |
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContraStore
          path: packages/*.deb
